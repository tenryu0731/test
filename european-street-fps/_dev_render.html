<!doctype html>
<html><head><meta charset="utf-8"><title>render dev harness (graphics agent, temporary)</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head><body><canvas id="game"></canvas>
<script type="module">
import * as THREE from 'three';
import { createGraphics } from './js/render.js';
const params = new URLSearchParams(location.search);
const gfx = createGraphics(document.getElementById('game'), { isTouch: params.has('touch'), params });
const { scene, camera, renderer } = gfx;
let heightAt = () => -0.25, mode = 'plane';
let materials = null;
try { materials = (await import('./js/textures.js')).createMaterials(renderer); } catch (e) { console.warn('[dev] materials failed', e.message); }
if (!params.has('synthetic')) {
  try {
    const { buildWorld } = await import('./js/world.js');
    const w = buildWorld(scene, materials, { renderer, camera });
    heightAt = w.heightAt; mode = 'world'; window.world = w;
  } catch (e) { console.warn('[dev] world failed', e.message); }
}
if (mode !== 'world') {
  // clear partial additions (keep render.js objects: sky, lights, camera)
  for (const o of [...scene.children]) if (!o.isLight && o !== camera && o.name !== 'sky' && !(o.parent === scene && o.type === 'Object3D' && o.children.length === 0 && o.name.includes('target'))) {
    if (o.isMesh || o.isGroup || o.isInstancedMesh || o.isPoints || o.isLine) scene.remove(o);
  }
  try {
    const { createTerrain } = await import('./js/terrain.js');
    const t = createTerrain(scene, { materials, renderer, camera });
    heightAt = t.heightAt; mode = 'terrain'; window.terrain = t;
  } catch (e) {
    console.warn('[dev] terrain failed', e.message);
    const g = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x8a8a55, roughness: 1 }));
    g.position.y = -0.25; g.receiveShadow = true; scene.add(g);
  }
  // Synthetic walled town: a north–south street with plaster / stone houses, towers, props.
  const rnd = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
  const cols = [0xd9c4a0, 0xcfa679, 0xc08a5c, 0xe0d2b4, 0xb89a74, 0xd4b48c];
  const mats = cols.map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.92 }));
  const roof = new THREE.MeshStandardMaterial({ color: 0xa4553a, roughness: 0.85 });
  const pave = new THREE.Mesh(new THREE.PlaneGeometry(240, 300).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x9c948a, roughness: 0.95 }));
  pave.receiveShadow = true; scene.add(pave);
  const box = new THREE.BoxGeometry(1, 1, 1);
  const add = (x, y, z, w, h, d, m) => { const b = new THREE.Mesh(box, m); b.position.set(x, y + h / 2, z); b.scale.set(w, h, d); b.castShadow = b.receiveShadow = true; scene.add(b); return b; };
  for (const side of [-1, 1]) {
    for (let z = 140; z > -140;) {
      const w = 7 + rnd() * 8, h = 9 + rnd() * 9;
      add(side * (4 + 6), 0, z - w / 2, 12, h, w - 0.2, mats[(rnd() * mats.length) | 0]);
      add(side * (4 + 6), h, z - w / 2, 12.6, 0.5, w + 0.3, roof);
      z -= w;
    }
    for (let z = 130; z > -130; z -= 26) add(side * 34, 0, z, 18, 10 + rnd() * 14, 20, mats[(rnd() * mats.length) | 0]);
  }
  for (const [x, z, h] of [[-20, -40, 52], [22, 10, 46], [-30, 60, 40], [40, -90, 55]]) add(x, 0, z, 7, h, 7, mats[4]);
  for (let z = 120; z > -120; z -= 9) { add(3.2, 0, z, 0.9, 0.9, 0.9, mats[1]); add(-3.4, 0, z - 4, 0.25, 3.5, 0.25, mats[4]); }
  // walls
  const wallM = mats[4];
  add(0, -8, 150, 240, 20, 2, wallM).position.x = -0; add(0, -8, -150, 240, 20, 2, wallM); add(120, -8, 0, 2, 20, 300, wallM); add(-120, -8, 0, 2, 20, 300, wallM);
}
// Simple stand-in viewmodel (own scene, own lights) to check the viewmodel pass.
const viewScene = new THREE.Scene();
const viewCamera = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.01, 20);
viewScene.add(new THREE.HemisphereLight(0xd8e8ff, 0xa08a6a, 0.95));
const vs = new THREE.DirectionalLight(0xfff0d8, 3); vs.position.set(-0.55, 1, 0.45); viewScene.add(vs);
const gun = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.5, metalness: 0.6 }));
gun.position.set(0.18, -0.16, -0.45); gun.rotation.y = 0.06; viewScene.add(gun);
const hand = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.08, 0.14), new THREE.MeshStandardMaterial({ color: 0xc89a74, roughness: 0.8 }));
hand.position.set(0.14, -0.2, -0.3); viewScene.add(hand);
gfx.onResize((a) => { viewCamera.aspect = a; viewCamera.updateProjectionMatrix(); });
gfx.resize();
await gfx.compile([[viewScene, viewCamera]]);
window.__h = {
  gfx, scene, camera, renderer, heightAt, mode, viewScene, viewCamera, THREE,
  // camera at (x, ground + eye, z) looking at (lx, ly, lz); ground-relative y when eye given
  view(x, y, z, lx, ly, lz, { eye = null, gun = true, focus = null, fov = 72 } = {}) {
    const gy = eye != null ? heightAt(x, z) + eye : y;
    camera.fov = fov; camera.updateProjectionMatrix();
    camera.position.set(x, gy, z); camera.lookAt(lx, ly, lz); camera.updateMatrixWorld();
    const f = focus || { x, y: eye != null ? heightAt(x, z) : 0, z };
    gfx.updateSun(f); gfx.update(1 / 60);
    window.world?.update?.(1 / 60, camera); window.terrain?.update?.(1 / 60, camera);
    gfx.render(gun ? viewScene : null, viewCamera);
    return { mode, y: +gy.toFixed(1), calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
  },
};
console.log('[dev] ready, mode', mode);
</script></body></html>
