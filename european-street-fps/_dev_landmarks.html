<!doctype html>
<html><head><meta charset="utf-8"><title>landmarks dev</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head><body><canvas id="game"></canvas>
<script type="module">
import * as THREE from 'three';
import { createMaterials } from './js/textures.js';
import { buildLandmarks } from './js/landmarks.js';
const params = new URLSearchParams(location.search);
let gfx = null;
try { const { createGraphics } = await import('./js/render.js'); gfx = createGraphics(document.getElementById('game'), { isTouch: false, params }); }
catch (e) { console.warn('render.js failed, fallback', e); }
if (!gfx) {
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game'), antialias: true });
  renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9cc0e0);
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.5, 4000);
  scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x8a7a60, 1.2));
  const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(-300, 400, 250); sun.castShadow = true; scene.add(sun, sun.target);
  renderer.setSize(innerWidth, innerHeight);
  gfx = { renderer, scene, camera, updateSun(f) { sun.target.position.set(f.x, f.y, f.z); sun.position.set(f.x - 300, f.y + 400, f.z + 250); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 1200 }); sun.shadow.camera.updateProjectionMatrix(); sun.shadow.mapSize.set(2048, 2048); }, render() { renderer.render(scene, camera); } };
}
const { renderer, scene, camera } = gfx;
gfx.resize?.();
const M = createMaterials(renderer);
let heightAt = null, terrain = null;
if (!params.has('flat')) {
  try { const { createTerrain } = await import('./js/terrain.js'); terrain = createTerrain(scene, { materials: M, renderer, camera }); heightAt = terrain.heightAt; }
  catch (e) { console.warn('terrain failed', e); }
}
if (!heightAt) {
  const { SITES } = await import('./js/layout.js');
  heightAt = (x, z) => { for (const s of SITES) if (Math.hypot(x - s.x, z - s.z) < s.r + 30) return s.y; return -40; };
  const g = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x7a8a50 }));
  g.position.y = -40; g.receiveShadow = true; scene.add(g);
}
const t0 = performance.now();
const lm = buildLandmarks(scene, M, { heightAt });
const buildMs = performance.now() - t0;
window.__lm = {
  THREE, scene, camera, gfx, lm, heightAt, terrain, buildMs,
  view(pos, look, sun) {
    camera.position.set(...pos); camera.lookAt(...look); camera.updateMatrixWorld();
    lm.update(0.016, camera); terrain?.update?.(0.016, camera);
    gfx.updateSun?.(new THREE.Vector3(...(sun || look)));
    gfx.update?.(0.016, { adaptive: false });
    gfx.render();
    const i = renderer.info.render; return { calls: i.calls, tris: i.triangles };
  },
};
window.__lm_ready = true;
</script></body></html>
