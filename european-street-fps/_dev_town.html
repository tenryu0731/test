<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><canvas id="game"></canvas><script type="module">
import * as THREE from 'three';
import { createGraphics } from './js/render.js';
import { createMaterials } from './js/textures.js';
import { buildCity } from './js/city.js';
const gfx = createGraphics(document.getElementById('game'), { params: new URLSearchParams('q=low') });
const t0 = performance.now();
const M = createMaterials(gfx.renderer);
const t1 = performance.now();
const city = buildCity(gfx.scene, M, {});
const t2 = performance.now();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x7d8a55, roughness: 1 }));
ground.position.y = -0.3; gfx.scene.add(ground);
gfx.resize();
window.__t = { gfx, city, M, times: { tex: t1 - t0, city: t2 - t1 },
  view(px, py, pz, lx, ly, lz) {
    const c = gfx.camera; c.position.set(px, py, pz); c.lookAt(lx, ly, lz);
    city.update(0, c); gfx.updateSun({ x: px, y: 0, z: pz }); gfx.update(0, {});
    gfx.renderer.info.autoReset = false; gfx.renderer.info.reset();
    gfx.render();
    const i = gfx.renderer.info.render; return { calls: i.calls, tris: i.triangles };
  } };
</script></body></html>
