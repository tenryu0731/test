<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#888}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script></head><body>
<script type="module">
// 車のモデル確認用: tools/car-view.html?t=sedan&a=0.6
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { makeCarModel } from '../js/vehicle.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(900, 560); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
const s = new THREE.Scene();
const env = await new RGBELoader().loadAsync('../assets/game/sky/kloofendal_48d_partly_cloudy_puresky_1k.hdr');
env.mapping = THREE.EquirectangularReflectionMapping; s.environment = env; s.background = new THREE.Color(0x9aa4ad);
const sun = new THREE.DirectionalLight(0xffffff, 3); sun.position.set(5, 10, 6); sun.castShadow = true; s.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x55585c, roughness: 0.9 })); g.receiveShadow = true; s.add(g);
let i = 0; for (const t of (q.get('t') || 'sedan,suv,taxi,truck').split(',')) { const m = makeCarModel(t, Math.random); m.root.position.x = (i++ - 1.5) * 3.2; s.add(m.root); }
const c = new THREE.PerspectiveCamera(35, 900 / 560, 0.1, 100); const a = +(q.get('a') || 0.7);
c.position.set(Math.sin(a) * 14, 3.2, Math.cos(a) * 14); c.lookAt(0, 0.8, 0);
r.render(s, c); window.DONE = true;
</script></body></html>
